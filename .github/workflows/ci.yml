name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        run: npm install --global pnpm@11.24.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify application
        run: pnpm verify

  fallow:
    name: Fallow changed-code gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pnpm
        run: npm install --global pnpm@11.24.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Select comparison commit
        id: comparison
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "sha=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
          elif [[ "$PUSH_BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            echo "sha=$PUSH_BEFORE_SHA" >> "$GITHUB_OUTPUT"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "sha=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(git hash-object -t tree /dev/null)" >> "$GITHUB_OUTPUT"
          fi
      - name: Reject new structural issues
        run: pnpm fallow:ci --base "${{ steps.comparison.outputs.sha }}"
